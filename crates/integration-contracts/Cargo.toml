[package]
name = "integration-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# JSON Schema validation of incoming envelopes. Default features are off so the
# crate does not pull HTTP/TLS resolvers: only the in-memory draft 2020-12
# validator is needed.
jsonschema = { version = "0.58", default-features = false }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by `artifact_fingerprint`, the ingest-side SHA-256 of artifact content.
sha2 = "0.10"
