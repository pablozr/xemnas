<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>/*__TITLE__*/</title>
<style>
/* Fonts of the app (Inter, JetBrains Mono, Bricolage Grotesque; all OFL), subset and inlined. */
@font-face{font-family:"Xm Sans";src:url(data:font/woff;base64,/*__FONT_INTER__*/) format("woff");font-weight:100 900;font-display:swap}
@font-face{font-family:"Xm Mono";src:url(data:font/woff;base64,/*__FONT_MONO__*/) format("woff");font-weight:100 800;font-display:swap}
@font-face{font-family:"Xm Display";src:url(data:font/woff;base64,/*__FONT_DISPLAY__*/) format("woff");font-weight:200 800;font-display:swap}
:root{
  --canvas:#0D111A;--raised:#111622;--deep:#090D15;--surface:#161C28;--hover:#1D2432;
  --selection:#1C1A28;--edge:#514A63;--line:rgba(205,199,220,.09);--line-strong:rgba(205,199,220,.18);
  --text:#ECEEF4;--text2:#BEC3D0;--muted:#858C9D;
  --accent:#9188A8;--accent-strong:#B3A5CB;--accent-soft:rgba(145,136,168,.16);--on-accent:#15111D;
  --danger:#D96776;--warn:#D9A441;--info:#7FA6D6;--ok:#6FBF8E;
  --node-a:#1B2130;--node-b:#141926;--glass:rgba(22,28,40,.78);--shadow:0 24px 70px rgba(0,0,0,.5);
  --aurora-a:rgba(168,158,186,.11);--aurora-b:rgba(127,166,214,.07);--dots:rgba(205,199,220,.10);
  --display:"Xm Display","Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --sans:"Xm Sans","Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:"Xm Mono","JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
}
:root[data-theme="light"]{
  --canvas:#F6F5F9;--raised:#FFFFFF;--deep:#ECEAF1;--surface:#FFFFFF;--hover:#F1EFF7;
  --selection:#EFEBFA;--edge:#B3A9CC;--line:rgba(40,34,60,.09);--line-strong:rgba(40,34,60,.2);
  --text:#1B1826;--text2:#454058;--muted:#7A7590;
  --accent:#6F6591;--accent-strong:#554A7C;--accent-soft:rgba(111,101,145,.11);--on-accent:#FFFFFF;
  --danger:#B8404F;--warn:#9A6A12;--info:#2F6AA8;--ok:#2F8052;
  --node-a:#FFFFFF;--node-b:#F8F7FC;--glass:rgba(255,255,255,.82);--shadow:0 24px 60px rgba(40,34,60,.14);
  --aurora-a:rgba(145,130,190,.14);--aurora-b:rgba(120,160,210,.10);--dots:rgba(40,34,60,.10);
}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;color:var(--text);font:400 14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";
  background:radial-gradient(1100px 560px at 8% -12%,var(--aurora-a),transparent 62%),radial-gradient(900px 520px at 100% -6%,var(--aurora-b),transparent 60%),var(--canvas);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:8px}
svg{display:block}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;height:60px;padding:0 22px;
  background:color-mix(in srgb,var(--canvas) 72%,transparent);backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:30px;height:30px;flex:none}
.brand .word{font:600 20px/1 var(--display);letter-spacing:-.02em}
.brand .sep{width:1px;height:18px;background:var(--line-strong);margin:0 3px}
.brand .proj{color:var(--muted);font-weight:500;max-width:28vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--raised);border:1px solid var(--line);margin-left:10px}
.tab{display:flex;align-items:center;gap:7px;background:none;border:0;padding:6px 14px;border-radius:8px;color:var(--text2);font-weight:500;font-size:13.5px;transition:background .18s,color .18s}
.tab svg{width:15px;height:15px;opacity:.8}
.tab:hover{color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);background:var(--selection);box-shadow:inset 0 0 0 1px var(--edge)}
.tab .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.stamp{color:var(--muted);font-size:12.5px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:6px 11px;color:var(--text2);font-size:13px;font-weight:500;transition:background .18s,border-color .18s,color .18s}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--hover);border-color:var(--line-strong);color:var(--text)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.icon{padding:6px 9px}

/* ---------- pages ---------- */
.page{display:none}
.page.on{display:block;animation:enter .42s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- architecture ---------- */
.map{position:relative;height:calc(100vh - 60px);overflow:hidden}
.map>svg.stage{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 1px 1px,var(--dots) 1px,transparent 0) 0 0/26px 26px}
.map>svg.stage.drag{cursor:grabbing}
.floaters{position:absolute;left:18px;right:18px;top:16px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:2}
.floaters>*{pointer-events:auto}
.pills{display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 330px)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px 13px 6px 8px;font-size:13px;color:var(--text2);font-weight:500;max-width:260px;transition:border-color .18s,color .18s,background .18s}
.pill i{display:grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font:600 11px var(--sans);font-style:normal;flex:none}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill:hover{border-color:var(--line-strong);color:var(--text)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--selection)}
.pill[aria-pressed="true"] i{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:6px}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom .btn{width:36px;height:36px;justify-content:center;padding:0;font-size:17px;line-height:1;background:var(--glass);backdrop-filter:blur(14px)}
.hint{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:opacity .4s}
kbd{font:500 11px var(--mono);background:var(--raised);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text2)}

.inspector{position:absolute;right:18px;top:68px;bottom:64px;width:340px;z-index:3;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);transform:translateX(24px);opacity:0;pointer-events:none;transition:transform .4s var(--ease),opacity .3s}
.inspector.on{transform:none;opacity:1;pointer-events:auto}
.inspector .head{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 12px}
.ico{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--line)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.inspector h3{font:600 21px/1.2 var(--display);letter-spacing:-.015em;margin:1px 0 3px}
.inspector .role{color:var(--text2);font-size:13.5px;margin:0}
.inspector .close{margin-left:auto}
.inspector .body{overflow:auto;padding:4px 18px 20px;flex:1}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 0 8px}
.tech{display:inline-block;font:500 11px var(--mono);padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent-strong);margin:0 5px 5px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--text2);margin:0 6px 6px 0}
.badge.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.row{display:flex;gap:11px;align-items:flex-start;text-align:left;background:none;border:1px solid transparent;border-radius:11px;padding:8px 9px;margin:0 -9px 2px;width:calc(100% + 18px);transition:background .15s,border-color .15s}
.row:hover{background:var(--hover);border-color:var(--line)}
.row .dir{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-size:12px;margin-top:1px}
.row b{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.row small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.row .via{font:500 10.5px var(--mono);color:var(--accent-strong)}
.empty{color:var(--muted);font-size:13px;padding:2px 0 4px}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:9px;color:var(--text2);font-size:13px}
.legend li{display:flex;gap:10px;align-items:center}
.legend .sw{width:26px;height:0;border-top:2px solid var(--edge);flex:none}
.legend .sw.hot{border-color:var(--accent-strong);border-top-style:dashed}

/* tour bar */
.tour{position:absolute;left:50%;bottom:18px;width:min(720px,calc(100% - 36px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:4;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 14px 18px;transition:transform .45s var(--ease),opacity .3s}
.tour.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.tour .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.tour .meta b{color:var(--accent-strong);font-weight:600;white-space:nowrap}
.tour .dots{display:flex;gap:5px;flex:1}
.tour .dots i{height:3px;flex:1;border-radius:3px;background:var(--line-strong);transition:background .3s}
.tour .dots i.done{background:var(--edge)}
.tour .dots i.now{background:var(--accent-strong)}
.tour h4{font:600 17px/1.3 var(--display);letter-spacing:-.01em;margin:8px 0 2px}
.tour p{margin:0;color:var(--text2);font-size:13.5px}
.tour .where{font-size:12px;color:var(--muted);margin-top:6px}
.tour .where[hidden]{display:none}
.tour .ctl{display:flex;gap:6px;align-items:center;margin-top:12px}

/* ---------- diagram (kept in exported SVG) ---------- */
/*SVG-START*/
.node .card{fill:url(#nodeFill);stroke:var(--line-strong);stroke-width:1;transition:stroke .2s}
.node{cursor:pointer;transition:opacity .25s,filter .25s}
.node:hover .card{stroke:var(--accent)}
.node.sel .card{stroke:var(--accent-strong);stroke-width:1.6}
.node.sel{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 38%,transparent))}
.node .sheen{fill:url(#sheen);pointer-events:none}
.node .tile{fill:var(--accent-soft);stroke:var(--line)}
.glyph{fill:none;stroke:var(--accent-strong);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node text{font-family:var(--sans);fill:var(--text)}
.node .name{font-size:15px;font-weight:600;letter-spacing:-.005em}
.node .role{font-size:12px;fill:var(--text2)}
.node .foot{font-size:11px;fill:var(--muted)}
.node .tg rect{fill:var(--accent-soft)}
.node .tg text{font:500 10.5px var(--mono);fill:var(--accent-strong)}
.node .warn circle{fill:var(--danger)}
.node .warn text{font-size:10.5px;font-weight:600;fill:var(--danger)}
.edge path.line{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .25s,stroke .25s}
.edge .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.edge .lbl rect{fill:var(--raised);stroke:var(--line-strong)}
.edge .lbl text{font:500 11px var(--sans);fill:var(--text2)}
.edge .lbl.mono text{font-family:var(--mono);font-size:10.5px;fill:var(--accent-strong)}
.edge .num circle{fill:var(--accent)}
.edge .num text{font:700 11px var(--sans);fill:var(--on-accent)}
.edge.hot path.line{stroke:var(--accent-strong);stroke-width:2.2;stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
.edge.still path.line{animation:none;stroke-dasharray:none}
@keyframes flow{to{stroke-dashoffset:-14}}
.dim{opacity:.14}
.edge.dim .lbl,.edge.dim .num{opacity:0}
.pulse{fill:var(--accent-strong);filter:drop-shadow(0 0 6px var(--accent-strong))}
marker path{fill:var(--edge)}
/*SVG-END*/

/* ---------- flows ---------- */
.flows{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);padding:26px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.rail .sec{margin:0 10px 12px}
.fitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:13px;padding:11px 12px;margin-bottom:3px;transition:background .18s,border-color .18s}
.fitem:hover{background:var(--hover)}
.fitem[aria-current="true"]{background:var(--selection);border-color:var(--edge)}
.fitem .no{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font:600 12px var(--sans);margin-top:1px}
.fitem[aria-current="true"] .no{background:var(--accent);color:var(--on-accent)}
.fitem b{display:block;font-weight:600;font-size:14px;line-height:1.35}
.fitem small{color:var(--muted);font-size:12px}
.fmain{padding:38px clamp(20px,4vw,56px) 90px;max-width:1120px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
.fmain h1{font:600 clamp(28px,3.4vw,40px)/1.1 var(--display);letter-spacing:-.025em;margin:0 0 10px}
.fdesc{color:var(--text2);font-size:16.5px;max-width:700px;margin:0 0 24px;line-height:1.6}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 20px}
.board{background:linear-gradient(180deg,color-mix(in srgb,var(--raised) 94%,transparent),color-mix(in srgb,var(--canvas) 60%,transparent));border:1px solid var(--line);border-radius:20px;padding:10px;overflow:auto;position:relative}
.progress{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:2px;transition:width .5s var(--ease)}
.seq text{font-family:var(--sans);fill:var(--text)}
.seq .part rect{fill:url(#nodeFill);stroke:var(--line-strong)}
.seq .part text{font-size:13px;font-weight:600}
.seq .life{stroke:url(#lifeFade);stroke-width:1.2}
.seq .msg{cursor:pointer;transition:opacity .25s}
.seq .msg path.l{fill:none;stroke:var(--edge);stroke-width:1.7;transition:stroke .25s}
.seq .msg text.t{font-size:12.5px;fill:var(--text2)}
.seq .msg text.v{font:500 10.5px var(--mono);fill:var(--accent-strong)}
.seq .msg circle.n{fill:var(--surface);stroke:var(--edge)}
.seq .msg text.n{font:700 10.5px var(--sans);fill:var(--text2)}
.seq .act{fill:var(--accent-soft);stroke:var(--edge)}
.seq .msg.on path.l{stroke:var(--accent-strong);stroke-width:2.4;stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
.seq .msg.on text.t{fill:var(--text);font-weight:600}
.seq .msg.on circle.n{fill:var(--accent);stroke:transparent}
.seq .msg.on text.n{fill:var(--on-accent)}
.seq .msg:not(.on){opacity:.55}
.seq .msg:hover{opacity:1}
.timeline{list-style:none;margin:34px 0 0;padding:0;max-width:760px;position:relative}
.timeline:before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--line-strong),var(--line))}
.step{position:relative;display:grid;grid-template-columns:32px 1fr;gap:16px;padding:6px 0 22px;cursor:pointer;opacity:.62;transition:opacity .25s}
.step:hover,.step.on{opacity:1}
.step .no{width:31px;height:31px;border-radius:999px;display:grid;place-items:center;background:var(--canvas);border:1px solid var(--edge);color:var(--text2);font:600 12.5px var(--sans);position:relative;z-index:1;transition:background .25s,color .25s,box-shadow .25s}
.step.on .no{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-soft)}
.step b{display:block;font:600 16.5px/1.35 var(--display);letter-spacing:-.01em}
.step .where{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:3px 0 7px}
.step .where svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.step p{margin:0 0 8px;color:var(--text2);font-size:14.5px;max-width:640px}
.step .via{font:500 11px var(--mono);color:var(--accent-strong)}
.src{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--muted);margin-top:4px}
.src code{font:500 11px var(--mono);color:var(--accent-strong);background:var(--accent-soft);border-radius:6px;padding:1px 6px;flex:none}
.src.rule code{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.foot{margin-top:46px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;max-width:760px}

.void{max-width:560px;margin:14vh auto;padding:0 24px;text-align:center}
.void h1{font:600 28px var(--display);letter-spacing:-.02em;margin:14px 0 8px}
.void p{color:var(--text2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--raised);border:1px solid var(--edge);border-radius:11px;padding:9px 16px;box-shadow:var(--shadow);font-size:13px;transition:.3s var(--ease);z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .flows{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto;padding:14px}
  .rail .sec{display:none}.fitem{width:auto;flex:none}
  .inspector{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:56%}
  .pills{max-width:100%}.floaters{flex-direction:column}.stamp,.brand .proj{display:none}.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <!--__LOGO__-->
    <span class="word">xemnas</span><span class="sep"></span><span class="proj" id="proj"></span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Seções" id="tabs"></nav>
  <div class="grow"></div>
  <span class="stamp" id="stamp"></span>
  <button class="btn icon" id="theme" type="button" aria-label="Alternar tema claro e escuro" title="Alternar tema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
  </button>
</header>
<main>
  <section class="page" id="p-arquitetura" aria-label="Arquitetura"></section>
  <section class="page" id="p-fluxos" aria-label="Fluxos"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="xemnas-data">/*__DATA__*/</script>
<script>
"use strict";
(function () {
  var D = JSON.parse(document.getElementById("xemnas-data").textContent);
  var A = D.architecture || { containers: [], interactions: [], hidden: 0 };
  var FLOWS = D.flows || [];
  var NS = "http://www.w3.org/2000/svg";
  var REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- helpers ---------- */
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    for (var k in attrs || {}) {
      var v = attrs[k];
      if (k === "class") el.className = v;

      h("button", { class: "btn icon", type: "button", "aria-label": "Passo anterior", title: "Anterior (←)", text: "←", onclick: function () { stopSeq(); setStep(curStep - 1, true); } }),
      h("button", { class: "btn primary", type: "button", id: "play", text: "▶  Reproduzir", onclick: toggleSeq }),
      h("button", { class: "btn icon", type: "button", "aria-label": "Próximo passo", title: "Próximo (→)", text: "→", onclick: function () { stopSeq(); setStep(curStep + 1, true); } }),
      h("div", { class: "grow" }),
      h("button", { class: "btn", type: "button", text: "Ver no mapa", onclick: function () { startTour(curFlow, curStep); } }),
      h("button", { class: "btn", type: "button", text: "Copiar Mermaid", onclick: function () { copy(flowMermaid(f), "Mermaid copiado"); } })]);
    var board = h("div", { class: "board" }, [h("div", { class: "progress", id: "progress" }), sequence(f)]);
    box.replaceChildren(h("p", { class: "eyebrow", text: "Fluxo " + (curFlow + 1) + " de " + FLOWS.length + " · " + plural(f.steps.length, "passo", "passos") }),
      h("h1", { text: f.title }), h("p", { class: "fdesc", text: f.description }), bar, board, line, footer());
    setStep(0, false);
  }
  function footer() {
    var d = D.generated_at ? new Date(D.generated_at) : null, when = d && !isNaN(d) ? d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" }) : "";
    return h("p", { class: "foot", text: (when ? "Gerada em " + when + ". " : "") + "Escrita pela IA a partir das decisões e regras confirmadas no Xemnas. É uma leitura, não uma autoridade: confira a fonte antes de agir." });
  }
  function setStep(i, scroll) {
    var f = FLOWS[curFlow]; curStep = Math.max(0, Math.min(f.steps.length - 1, i));
    Array.prototype.forEach.call(document.querySelectorAll(".seq .msg"), function (m) { m.classList.toggle("on", +m.getAttribute("data-step") === curStep); });
    Array.prototype.forEach.call(document.querySelectorAll(".step"), function (m) {
      var on = +m.getAttribute("data-step") === curStep; m.classList.toggle("on", on);
      if (on && scroll) m.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
    });
    var pr = $("progress"); if (pr) pr.style.width = ((curStep + 1) / f.steps.length * 100) + "%";
  }
  function stopSeq() { if (seqPlayer) { clearInterval(seqPlayer); seqPlayer = null; var b = $("play"); if (b) b.textContent = "▶  Reproduzir"; } }
  function toggleSeq() {
    if (seqPlayer) return stopSeq();
    var n = FLOWS[curFlow].steps.length; if (curStep >= n - 1) setStep(0, true);
    $("play").textContent = "❚❚  Pausar";
    seqPlayer = setInterval(function () { if (curStep >= n - 1) return stopSeq(); setStep(curStep + 1, true); }, 1900);
  }
  function buildFluxos() {
    var root = $("p-fluxos");
    if (!FLOWS.length) { root.append(emptyPage("Sem fluxos ainda", "Gere a visão com decisões suficientes para a IA descrever os fluxos.")); return; }
    var rail = h("nav", { class: "rail", "aria-label": "Fluxos" }, [h("p", { class: "sec", text: "Fluxos" })]);
    FLOWS.forEach(function (f, i) {
      rail.append(h("button", { class: "fitem", type: "button", "aria-current": "false", onclick: function () { openFlow(i); } }, [h("span", { class: "no", text: i + 1 }), h("span", {}, [h("b", { text: f.title }), h("small", { text: plural(f.steps.length, "passo", "passos") })])]));
    });
    root.append(h("div", { class: "flows" }, [rail, h("div", { class: "fmain", id: "fmain" })]));
    openFlow(curFlow);
  }

  /* ---------- keys, theme, boot ---------- */
  document.addEventListener("keydown", function (ev) {
    if (ev.defaultPrevented || ev.ctrlKey || ev.metaKey || ev.altKey || /input|textarea|select/i.test(ev.target.tagName)) return;
    var onMap = $("p-arquitetura").classList.contains("on"), onFlows = $("p-fluxos").classList.contains("on");
    if (ev.key === "1") go("arquitetura"); else if (ev.key === "2") go("fluxos");
    else if (onMap && L) {
      if (ev.key === "Escape" || ev.key === "f" || ev.key === "F") clearAll();
      else if (tour && ev.key === "ArrowRight") { ev.preventDefault(); stopPlayer(); tourStep(tour.step + 1); }
      else if (tour && ev.key === "ArrowLeft") { ev.preventDefault(); stopPlayer(); tourStep(tour.step - 1); }
    } else if (onFlows && FLOWS.length) {
      if (ev.key === "ArrowRight") { ev.preventDefault(); stopSeq(); setStep(curStep + 1, true); }
      if (ev.key === "ArrowLeft") { ev.preventDefault(); stopSeq(); setStep(curStep - 1, true); }
    }
  });
  var BUILD = { arquitetura: buildArquitetura, fluxos: buildFluxos };
  $("proj").textContent = D.project || "";
  (function () { var d = D.generated_at ? new Date(D.generated_at) : null; if (d && !isNaN(d)) $("stamp").textContent = d.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" }); })();
  var saved = null; try { saved = localStorage.getItem("xemnas-theme"); } catch (e) {}
  var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  function setTheme(t) { theme = t; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("xemnas-theme", t); } catch (e) {} }
  setTheme(theme);
  $("theme").addEventListener("click", function () { setTheme(theme === "dark" ? "light" : "dark"); });
  (function () { // the mark doubles as the tab icon
    var mark = document.querySelector(".brand .mark"); if (!mark) return;
    var link = document.createElement("link"); link.rel = "icon"; link.type = "image/svg+xml";
    var clone = mark.cloneNode(true); clone.setAttribute("xmlns", NS);
    link.href = "data:image/svg+xml," + encodeURIComponent(new XMLSerializer().serializeToString(clone)); document.head.append(link);
  })();
  function route() { var q = (location.hash || "#arquitetura").slice(1).split("/"); go(q[0], q[1] != null ? parseInt(q[1], 10) : null); }
  route();
  window.addEventListener("hashchange", route);
})();
</script>
</body>
</html>
