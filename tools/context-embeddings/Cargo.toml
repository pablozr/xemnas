[package]
name = "context-embeddings"
version = "0.1.0"
edition = "2021"
publish = false

# Outside the app workspace: the tokenizer stays out of the app's build.
[workspace]

[dependencies]
model2vec-rs = { version = "=0.3.0", default-features = false, features = ["local-only", "fancy-regex"] }
serde_json = "1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
tokenizers = "0.22"

# Smart App Control blocked these build scripts and proc-macros on the
# author's machine; a different codegen-units only changes their hash.
[profile.release.package."anyhow"]
codegen-units = 3
[profile.release.package."crossbeam-deque"]
codegen-units = 3
[profile.release.package."esaxx-rs"]
codegen-units = 5
[profile.release.package."num-traits"]
codegen-units = 3
[profile.release.package."paste"]
codegen-units = 7
[profile.release.package."rayon-core"]
codegen-units = 3
[profile.release.package."serde_json"]
codegen-units = 3
