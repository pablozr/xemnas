[package]
name = "semantic-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["embedding"]
embedding = ["dep:fastembed", "dep:tokenizers"]
lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures", "dep:tokio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.9"
fastembed = { version = "=7.1.0", optional = true, default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
# Build scripts apply the documented HTTP-error cfg fix to an isolated copy.
lancedb = { version = "=0.39.0", optional = true, default-features = false }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[profile.release]
debug = 0
strip = "debuginfo"
lto = false
codegen-units = 256
