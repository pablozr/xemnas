name: ci

on:
  push:
  pull_request:

jobs:
  docs:
    name: local documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_check_doc_links.py
      - run: python tools/check-doc-links.py

  quality:
    name: quality gate (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Audit
        run: cargo audit

      - name: Deny
        run: cargo deny check

  package:
    name: package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xemnas-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  contract:
    name: capture contract (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/opencode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm test
