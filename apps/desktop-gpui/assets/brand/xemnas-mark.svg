<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    xemnas mark: a decision crossing.
    Two paths cross; the chosen one (lavender) passes through unbroken, the
    alternative (light) is interrupted where they meet. The product keeps the
    choice and the path not taken.
    Tile: charcoal with a slight lavender bias, 1 px inner edge, no glow.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26222F"/>
      <stop offset="1" stop-color="#131119"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chosen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4C9EE"/>
      <stop offset="1" stop-color="#A897CF"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>

  <!-- the path not taken: interrupted at the crossing -->
  <g stroke="#E6E3EE" stroke-opacity="0.58" stroke-width="112" stroke-linecap="round" fill="none">
    <line x1="708" y1="316" x2="592" y2="432"/>
    <line x1="432" y1="592" x2="316" y2="708"/>
  </g>

  <!-- the chosen path: continuous -->
  <line x1="316" y1="316" x2="708" y2="708"
        stroke="url(#chosen)" stroke-width="112" stroke-linecap="round"/>
</svg>
