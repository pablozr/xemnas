[package]
name = "desktop-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xemnas_desktop"
path = "src/lib.rs"

[[bin]]
name = "xemnas"
path = "src/main.rs"

[[bin]]
name = "quiet-glass-gallery"
path = "src/bin/quiet_glass_gallery.rs"

[dependencies]
application = { version = "0.1.0", path = "../../crates/application" }
domain = { version = "0.1.0", path = "../../crates/domain" }
# Composition root wiring: `main.rs` opens the store and mounts it into the
# `Projects` use case. The UI only receives the application port; no SQL type is
# named in `app.rs` or `screens/**`.
storage-sqlite = { version = "0.1.0", path = "../../crates/storage-sqlite" }
# Composition root wiring: `main.rs` starts the loopback-only local API beside
# the database and hands it the ingest use case; the UI never talks to HTTP.
local-api = { version = "0.1.0", path = "../../crates/local-api" }
# External AI provider adapter; `main.rs` chooses between it and the offline
# fake from the stored profile (ticket 13).
ai-provider = { version = "0.1.0", path = "../../crates/ai-provider" }
telemetry = { version = "0.1.0", path = "../../crates/telemetry" }
# Technical diagnostics are emitted through the `telemetry` subscriber; the UI
# only ever renders product-language copy.
tracing = "0.1"
# Pinned to the Zed monorepo revision accepted in ADR 0001 (AccessKit support,
# zed#56065). GPUI and gpui_platform are only allowed inside this crate; the
# architecture guard in tests/architecture enforces that.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "244023605536a412ab6b8d5b658466b89fb15401" }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "244023605536a412ab6b8d5b658466b89fb15401" }
rfd = { version = "0.17.2", default-features = false, features = ["pollster"] }
unicode-segmentation = "1.13"
serde_json = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Background images: decoded, downscaled, blurred and dimmed once, off the
# UI thread (`ui::wallpaper`). Same version GPUI already pulls in.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
