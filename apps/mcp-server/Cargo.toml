[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xemnas_mcp"
path = "src/lib.rs"

[[bin]]
name = "xemnas-mcp"
path = "src/main.rs"

[dependencies]
application = { version = "0.1.0", path = "../../crates/application" }
# Blocking client for the loopback local API; same version and features as ai-provider.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
serde_json = "1"
