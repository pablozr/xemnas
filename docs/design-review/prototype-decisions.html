<script>
const fileIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const data=[{id:1,q:'Como garantir uma única decisão por captura?',choice:'Confirmar candidatos em uma transação com validação de versão.',rationale:'A validação impede decisões duplicadas quando duas revisões acontecem ao mesmo tempo. A confirmação grava a decisão e avança o estado do candidato na mesma transação.',v:3,date:'29 set 2026',status:'Confirmada',source:'inbox.rs',path:'src/inbox.rs',scope:'Confirmação de candidatos no armazenamento local.',assumption:'A versão lida identifica o estado que foi revisado pelo usuário.',consequence:'Tentativas concorrentes recebem um estado atualizado para nova revisão.',reconsider:'Quando o armazenamento precisar aceitar gravações distribuídas.',code:'transaction.begin();\nvalidate_version(candidate);\npersist_decision(candidate);\ntransaction.commit();'},
{id:2,q:'Onde armazenar credenciais do provedor?',choice:'Guardar a chave no cofre de credenciais do sistema.',rationale:'A chave fica fora do arquivo de configuração e dos logs. O provedor recebe o segredo apenas durante a composição da chamada.',v:2,date:'28 set 2026',status:'Confirmada',source:'provider.rs',path:'src/provider.rs',scope:'Credenciais dos provedores configurados.',assumption:'O cofre do sistema está disponível na máquina do usuário.',consequence:'A configuração pode ser compartilhada sem incluir a chave.',reconsider:'Quando houver suporte a ambientes sem cofre de credenciais.',code:'let secret = keystore.get(profile_id)?;\nprovider.configure(secret);'},
{id:3,q:'Como recuperar jobs interrompidos?',choice:'Reenfileirar apenas tarefas idempotentes após uma interrupção.',rationale:'Operações que não podem ser repetidas exigem tratamento explícito. A recuperação não deve duplicar seus efeitos.',v:1,date:'27 set 2026',status:'Confirmada',source:'queue.rs',path:'src/queue.rs',scope:'Recuperação da fila após encerramento inesperado.',assumption:'Cada tarefa declara sua idempotência.',consequence:'Tarefas não idempotentes precisam de intervenção.',reconsider:'Quando o executor oferecer uma garantia diferente de entrega.',code:'if job.idempotent {\n    queue.requeue(job);\n}'},
{id:4,q:'Como reenviar capturas com falha?',choice:'Usar uma fila sem controle de idempotência.',rationale:'Esta versão foi substituída por uma abordagem que preserva a chave original.',v:1,date:'24 set 2026',status:'Substituída',source:'capture.rs',path:'src/capture.rs',scope:'Captura local.',assumption:'Uma captura seria enviada uma única vez.',consequence:'O reenvio poderia produzir duplicatas.',reconsider:'Falhas de entrega já exigiram reconsideração.',code:'queue.send(capture);'}];
let variant=new URLSearchParams(location.search).get('variant')||'C';if(!['A','B','C'].includes(variant))variant='A';let selected=1,query='',filter='Confirmada',detailTab='document',revision=0,source=0;
const names={A:'Lista + documento',B:'Catálogo + abertura de detalhe',C:'Documento + índice temporal · escolhida'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=d=>`<span class="badge ${d.status==='Substituída'?'old':''}">${d.status}</span>`;
const filtered=()=>data.filter(d=>(filter==='Todas'||d.status===filter)&&(!query||`${d.q} ${d.choice} ${d.rationale}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())));
function controls(){return `<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="query" aria-label="Buscar decisões do projeto" placeholder="Buscar decisões do projeto" value="${esc(query)}"></div><div class="filters"><select id="filter" aria-label="Estado"><option ${filter==='Confirmada'?'selected':''}>Confirmada</option><option ${filter==='Todas'?'selected':''}>Todas</option><option ${filter==='Substituída'?'selected':''}>Substituída</option></select><span class="muted small">Recentes</span></div>`}
function entries(items){return items.map(d=>`<button class="entry ${selected===d.id?'active':''}" data-select="${d.id}" aria-pressed="${selected===d.id}"><span class="meta"><span>v${d.v} · ${d.date}</span>${badge(d)}</span><strong>${esc(d.q)}</strong><span class="excerpt">${esc(d.choice)}</span></button>`).join('')||`<div class="empty"><strong>Nenhuma decisão encontrada</strong>Tente outro termo ou estado.</div>`}
function index(items){if(variant==='C')return indexC(items);return `<aside class="index"><div class="index-head"><h2>Decisões do projeto</h2>${controls()}<p class="scope">${query?'Até 50 resultados · busca no projeto':'Mais recentes primeiro · carregamento por página'}</p></div>${variant==='C'?'<div class="group-label">SETEMBRO 2026</div>':''}${entries(items)}</aside>`}
function doc(d){if(variant==='C')return docC(d);let old=detailTab==='history'&&revision>0;let choice=old&&d.id===1?'Validar o candidato antes de persistir a decisão.':d.choice;return `<div class="document">${old?'<div class="history-note">Versão anterior · somente leitura. Revisar e exportar usam a versão atual.</div>':''}<div class="small muted">${d.date} · ${old?'v'+Math.max(1,d.v-revision):'v'+d.v} ${old?'':'· revisão atual'}</div><h2>${esc(d.q)}</h2><section><h3>Escolha</h3><p class="choice">${esc(choice)}</p></section><section><h3>Justificativa</h3><p>${esc(d.rationale)}</p></section>${[['Escopo',d.scope],['Premissas',d.assumption],['Consequências',d.consequence],['Reconsiderar quando',d.reconsider]].map(([name,text])=>`<details><summary>${name}</summary><ul><li>${esc(text)}</li></ul></details>`).join('')}<section><h3>Evidências</h3><div class="code-panel"><div class="files"><button data-source="0" class="${source===0?'active':''}">${fileIcon}${d.source}</button><button data-source="1" class="${source===1?'active':''}">${fileIcon}captura.txt</button></div><div class="source-meta"><strong>${source===0?d.path:'captura.txt'}</strong>${source===0?'Trecho de alteração · linhas da fonte':'Texto da captura · origem preservada'}</div><pre>${(source===0?d.code:'Registro fictício usado apenas neste estudo.').split('\n').map((line,i)=>`<span class="ln">${source===0?24+i:1+i}</span>${esc(line)}`).join('\n')}</pre></div><div class="source-footer">Origem: captura local · sessão opencode-demo-42</div></section></div>`}
function reader(d){if(variant==='C')return readerC(d);if(!d)return `<div class="reader"><div class="empty"><strong>Selecione uma decisão</strong>O documento e suas evidências aparecem aqui.</div></div>`;return `<article class="reader"><div class="reader-toolbar"><div>${badge(d)} <span class="small muted" style="margin-left:10px">v${d.v}</span></div><div class="actions"><button data-action="export">Exportar…</button>${d.status==='Confirmada'?'<button data-action="revise" class="primary">Revisar</button>':''}</div></div><div class="reader-scroll"><nav class="detail-tabs" aria-label="Leitura"><button data-detail="document" class="${detailTab==='document'?'active':''}">Documento</button><button data-detail="history" class="${detailTab==='history'?'active':''}">Histórico <span class="muted small">${d.v}</span></button></nav>${detailTab==='history'?`<div class="history"><aside class="revision-index">${Array.from({length:d.v},(_,i)=>`<button data-revision="${i}" class="${revision===i?'active':''}">v${d.v-i}${i===0?' · atual':''}</button>`).join('')}</aside><div>${doc(d)}</div></div>`:doc(d)}</div></article>`}
function render(){document.body.classList.toggle('variant-c',variant==='C');document.body.classList.toggle('compare-mode',new URLSearchParams(location.search).get('compare')==='1');const items=filtered();const d=items.find(d=>d.id===selected)||items[0];if(d)selected=d.id;let view=document.getElementById('view');if(variant==='A')view.innerHTML=index(items)+reader(d);if(variant==='C')view.innerHTML=`<div class="chronicle">${reader(d)}${index(items)}</div>`;if(variant==='B')view.innerHTML=`<div class="table-view"><div class="catalog-top"><h2>Decisões do projeto</h2><p>Escolhas confirmadas, com histórico e evidências preservadas.</p></div><div class="catalog-toolbar"><div>${controls()}</div><span class="muted small">Mais recentes primeiro</span></div><table><thead><tr><th>Pergunta</th><th>Escolha</th><th>Estado</th><th>Revisão</th><th>Atualizada</th></tr></thead><tbody>${items.map(d=>`<tr data-open="${d.id}" tabindex="0"><td>${esc(d.q)}</td><td>${esc(d.choice)}</td><td>${badge(d)}</td><td>v${d.v}</td><td class="small muted">${d.date}</td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">Nenhuma decisão encontrada.</div>'}</div>`;document.getElementById('variantLabel').textContent=variant+' — '+names[variant];document.getElementById('state').textContent=variant+' · '+names[variant];bind(view);const input=document.getElementById('query');input.oninput=()=>{let start=input.selectionStart;query=input.value;render();let next=document.getElementById('query');next.focus();next.setSelectionRange(start,start)};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()}}
function modal(title,body,footer=''){const root=document.getElementById('overlay');root.hidden=false;root.dataset.mode='';root.innerHTML=`<div class="dialog-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button id="close" aria-label="Fechar">×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div></div>`;root.querySelector('#close').onclick=closeModal;root.querySelector('#close').focus();return root}function closeModal(){document.getElementById('overlay').hidden=true;document.getElementById('overlay').innerHTML=''}
function refresh(root,preserveScroll=false){const offset=root.querySelector('.reader-scroll')?.scrollTop||0;if(root.id==='overlay'&&root.dataset.mode==='detail'){let d=data.find(d=>d.id===selected);let m=modal('Decisao confirmada',`<div style="height:65vh;display:flex">${reader(d)}</div>`);m.dataset.mode='detail';bind(m)}else render();if(preserveScroll){const pane=root.querySelector('.reader-scroll');if(pane)pane.scrollTop=offset}}
function bind(root){root.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selected=+el.dataset.select;detailTab='document';revision=0;source=0;refresh(root)});root.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>{detailTab=el.dataset.detail;revision=0;refresh(root)});root.querySelectorAll('[data-revision]').forEach(el=>el.onclick=()=>{revision=+el.dataset.revision;refresh(root)});root.querySelectorAll('[data-source]').forEach(el=>el.onclick=()=>{source=+el.dataset.source;refresh(root,true)});root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));root.querySelectorAll('[data-open]').forEach(el=>{const open=()=>{selected=+el.dataset.open;detailTab='document';const d=data.find(d=>d.id===selected);let m=modal('Decisão confirmada',`<div style="height:65vh;display:flex">${reader(d)}</div>`);m.dataset.mode='detail';bind(m)};el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter')open()}})}
function action(kind){if(variant==='C'&&sourceActionC(kind))return;let d=data.find(d=>d.id===selected);if(kind==='export'){let m=modal('Exportar versão atual',`<p>A prévia usa a versão atual v${d.v}. O arquivo só será gravado no destino escolhido.</p><label class="form">Formato<select id="format" style="margin-left:15px;padding:6px;background:var(--rail)"><option>Markdown</option><option>JSON</option></select></label><pre id="exportPreview"></pre>`,`<span class="muted small" style="margin-right:auto;align-self:center">Estudo · nenhuma gravação</span><button id="cancel">Cancelar</button><button class="primary" id="destination">Escolher destino…</button>`);let update=()=>{m.querySelector('#exportPreview').textContent=m.querySelector('#format').value==='JSON'?JSON.stringify({question:d.q,choice:d.choice,rationale:d.rationale,version:d.v},null,2):`# ${d.q}\n\n## Escolha\n${d.choice}\n\n## Justificativa\n${d.rationale}\n\n## Escopo\n- ${d.scope}\n\n## Reconsiderar quando\n- ${d.reconsider}`};update();m.querySelector('#format').onchange=update;m.querySelector('#cancel').onclick=closeModal;m.querySelector('#destination').onclick=()=>{m.querySelector('#destination').textContent='Destino demonstrativo · sem gravação';m.querySelector('#destination').disabled=true}}
if(kind==='revise'){let m=modal('Nova revisão',`<p>A revisão atual permanece no histórico. Alterações criam a versão v${d.v+1}.</p><label class="form">Pergunta<input id="editQ" value="${esc(d.q)}"></label><label class="form">Escolha<textarea id="editC">${esc(d.choice)}</textarea></label><label class="form">Justificativa<textarea id="editR">${esc(d.rationale)}</textarea></label>`,`<span class="muted small" style="margin-right:auto;align-self:center">Dados somente em memória</span><button id="cancel">Cancelar</button><button class="primary" id="save">Salvar nova revisão</button>`);m.querySelector('#cancel').onclick=closeModal;m.querySelector('#save').onclick=()=>{d.q=m.querySelector('#editQ').value;d.choice=m.querySelector('#editC').value;d.rationale=m.querySelector('#editR').value;d.v++;closeModal();detailTab='document';render()}}}
function changeVariant(step){let values=['A','B','C'];variant=values[(values.indexOf(variant)+step+3)%3];let url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);closeModal();detailTab='document';render()}document.getElementById('prev').onclick=()=>changeVariant(-1);document.getElementById('next').onclick=()=>changeVariant(1);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(e.target.closest('input,textarea,select,[contenteditable]')||!document.getElementById('overlay').hidden)return;if(e.key==='ArrowRight')changeVariant(1);if(e.key==='ArrowLeft')changeVariant(-1)});render();
</script></body></html>
